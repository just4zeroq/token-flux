server:
  api:
    address: ":8080"
  gateway:
    address: ":8081"
  admin:
    apiToken: "admin-dev-token"

modelKey:
  encryptionKey: "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"

database:
  default:
    type: "pgsql"
    host: "127.0.0.1"
    port: "5432"
    user: "postgres"
    pass: "123456"
    name: "flux"
    debug: false

logger:
  level: "info"
  stdout: true

jwt:
  secret: "change-me-in-prod"
  expireHours: 24

wallet:
  hd:
    mnemonic_env: "WALLET_MNEMONIC"
  chains:
    bnb:
      rpc: "https://bsc-dataseed.binance.org"
      confirmations: 12
      poll_interval_seconds: 5
    base:
      rpc: "https://mainnet.base.org"
      confirmations: 12
      poll_interval_seconds: 5
    ton:
      api: "https://toncenter.com/api/v2"
      confirmations: 1
      poll_interval_seconds: 5

redis:
  default:
    address: "127.0.0.1:6379"
    db: 0
    pass: ""

usage:
  recorder:
    batch_size: 50
    flush_interval_ms: 100

settlement:
  cron: "0 0 3 * * *"
